<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chennai Property Buying & Rental System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f6fc;
            color: #222;
        }

        header {
            background: #123c69;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .purpose {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        .purpose label {
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca1;
        }

        #results {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #eaf4ff;
            border-radius: 8px;
        }

        .property {
            background: white;
            padding: 18px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .property h3 {
            color: #123c69;
            margin-bottom: 10px;
        }

        .book-btn {
            background: #28a745;
            margin-top: 15px;
        }

        .book-btn:hover {
            background: #218838;
        }

        #confirmation {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #e8f7e8;
            border: 1px solid #9ad49a;
            border-radius: 8px;
        }

        #confirmation h2 {
            color: #218838;
            margin-bottom: 15px;
        }

        @media(max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>🏠 Chennai Property Portal</h1>

    <p>Cloud-Based Property Buying & Rental Application</p>

</header>


<div class="container">


    <!-- BUY / RENT -->

    <div class="purpose">

        <label>

            <input type="radio"
                   name="purpose"
                   value="Buy"
                   checked>

            Buy

        </label>


        <label>

            <input type="radio"
                   name="purpose"
                   value="Rent">

            Rent

        </label>

    </div>



    <div class="form-grid">


        <!-- PROPERTY TYPE -->

        <div class="form-group">

            <label>Property Type</label>

            <select id="propertyType">

                <option>Residential</option>

                <option>Commercial</option>

                <option>Apartment</option>

                <option>Villa</option>

                <option>Independent House</option>

                <option>Plot</option>

            </select>

        </div>



        <!-- PLACE -->

        <div class="form-group">

            <label>Place</label>

            <select id="place">

                <option>Adyar</option>

                <option>Anna Nagar</option>

                <option>T. Nagar</option>

                <option>Velachery</option>

                <option>Tambaram</option>

                <option>Porur</option>

                <option>OMR</option>

                <option>Sholinganallur</option>

                <option>Perungudi</option>

            </select>

        </div>



        <!-- AREA -->

        <div class="form-group">

            <label>Area</label>

            <select id="area">

                <option>500 - 1000 sq.ft</option>

                <option>1000 - 1500 sq.ft</option>

                <option>1500 - 2000 sq.ft</option>

                <option>2000 - 3000 sq.ft</option>

                <option>Above 3000 sq.ft</option>

            </select>

        </div>



        <!-- MIN PRICE -->

        <div class="form-group">

            <label>Minimum Price Range</label>

            <input type="number"
                   id="minPrice"
                   placeholder="₹ Minimum">

        </div>



        <!-- MAX PRICE -->
